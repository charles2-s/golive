<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoLive Asia — Sign In</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tickets.css">
</head>
<body class="login-page">
  <div class="login-card">
    <img src="/images/logo.png" alt="GoLive Logo" class="login-logo">
    <h1 class="login-title" id="auth-title">Sign In</h1>
    <p class="login-subtitle" id="auth-subtitle">Sign in to access your tickets and account.</p>

    <form id="login-form" class="login-form">
      <div class="form-group" id="name-group" style="display:none;">
        <label for="login-name">Full Name</label>
        <input type="text" id="login-name" placeholder="Your full name">
      </div>
      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-primary" id="auth-button">Sign In</button>
    </form>

    <p id="login-error" class="login-error" style="display:none;"></p>

    <p class="login-footer">
      <span id="toggle-text">Don't have an account?</span> <a href="#" id="toggle-auth">Create one</a>
    </p>
  </div>

  <script src="/js/tickets.js"></script>
  <script>
    var isSignupMode = false;
    
    document.getElementById('toggle-auth').addEventListener('click', function (e) {
      e.preventDefault();
      isSignupMode = !isSignupMode;
      
      if (isSignupMode) {
        document.getElementById('auth-title').textContent = 'Sign Up';
        document.getElementById('auth-subtitle').textContent = 'Create your account to get started.';
        document.getElementById('name-group').style.display = 'flex';
        document.getElementById('auth-button').textContent = 'Sign Up';
        document.getElementById('toggle-text').textContent = 'Already have an account?';
        document.getElementById('toggle-auth').textContent = 'Sign In';
      } else {
        document.getElementById('auth-title').textContent = 'Sign In';
        document.getElementById('auth-subtitle').textContent = 'Sign in to access your tickets and account.';
        document.getElementById('name-group').style.display = 'none';
        document.getElementById('auth-button').textContent = 'Sign In';
        document.getElementById('toggle-text').textContent = "Don't have an account?";
        document.getElementById('toggle-auth').textContent = 'Create one';
      }
      document.getElementById('login-error').style.display = 'none';
    });

    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var email = document.getElementById('login-email').value.trim();
      var password = document.getElementById('login-password').value;
      var errEl = document.getElementById('login-error');

      if (!email || !password) {
        errEl.textContent = 'Please enter your email and password.';
        errEl.style.display = 'block';
        return;
      }

      // Force single hardcoded account
      try {
        var allowed = [{name: 'Luqman', email: 'annanluqman@gmail.com', password: 'luqman21541037$'}];
        localStorage.setItem('golive_users', JSON.stringify(allowed));
      } catch(ex) {}

      var users = JSON.parse(localStorage.getItem('golive_users') || '[]');
      var foundUser = users.find(function(u) { 
        return u.email.toLowerCase() === email.toLowerCase() && u.password === password; 
      });
      if (!foundUser) {
        errEl.textContent = 'Invalid email or password.';
        errEl.style.display = 'block';
        return;
      }
      window.GoLive.Auth.setUser({
        name: foundUser.name,
        email: foundUser.email,
        loggedIn: true,
        loginTime: new Date().toISOString()
      });
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
