<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoLive Asia — Register</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tickets.css">
</head>
<body class="login-page">
  <div class="login-card">
    <img src="/images/logo.png" alt="GoLive Logo" class="login-logo">
    <h1 class="login-title">Sign Up</h1>
    <p class="login-subtitle">Create your account to get started.</p>

    <form id="register-form" class="login-form">
      <div class="form-group">
        <label for="reg-firstname">First Name</label>
        <input type="text" id="reg-firstname" placeholder="First name" required>
      </div>
      <div class="form-group">
        <label for="reg-lastname">Last Name</label>
        <input type="text" id="reg-lastname" placeholder="Last name" required>
      </div>
      <div class="form-group">
        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="reg-phone">Phone</label>
        <input type="tel" id="reg-phone" placeholder="e.g., 0123456789" required>
      </div>
      <div class="form-group">
        <label for="reg-password">Password</label>
        <input type="password" id="reg-password" placeholder="••••••••" required>
      </div>
      <div class="form-group">
        <label for="reg-confirm">Confirm Password</label>
        <input type="password" id="reg-confirm" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-primary">Register</button>
    </form>

    <p id="reg-error" class="login-error" style="display:none;"></p>

    <p class="login-footer">
      Already have an account? <a href="login.html">Sign In</a>
    </p>
  </div>

  <script src="/js/tickets.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var firstName = document.getElementById('reg-firstname').value.trim();
      var lastName = document.getElementById('reg-lastname').value.trim();
      var email = document.getElementById('reg-email').value.trim();
      var phone = document.getElementById('reg-phone').value.trim();
      var password = document.getElementById('reg-password').value;
      var confirm = document.getElementById('reg-confirm').value;
      var errEl = document.getElementById('reg-error');

      if (!firstName || !lastName || !email || !phone || !password || !confirm) {
        errEl.textContent = 'Please fill in all fields.';
        errEl.style.display = 'block';
        return;
      }
      if (password !== confirm) {
        errEl.textContent = 'Passwords do not match.';
        errEl.style.display = 'block';
        return;
      }

      var users = JSON.parse(localStorage.getItem('golive_users') || '[]');
      if (users.find(function(u) { return u.email.toLowerCase() === email.toLowerCase(); })) {
        errEl.textContent = 'An account with this email already exists.';
        errEl.style.display = 'block';
        return;
      }

      var newUser = {
        name: firstName + ' ' + lastName,
        firstName: firstName,
        lastName: lastName,
        email: email,
        phone: phone,
        password: password
      };
      users.push(newUser);
      localStorage.setItem('golive_users', JSON.stringify(users));

      window.GoLive.Auth.setUser({
        name: newUser.name,
        email: newUser.email,
        loggedIn: true,
        loginTime: new Date().toISOString()
      });

      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
